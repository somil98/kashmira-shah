<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Kashmira Shah</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <h2>Kashmira Shah</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="catalog.html" class="nav-link active">Catalog</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="catalog-hero">
            <div class="container">
                <div class="catalog-header">
                    <h1>Product Catalog</h1>
                    <p>Discover our complete range of Ektra by Srithai Superware products</p>
                    <div class="catalog-filters">
                        <button class="filter-btn active" data-filter="all">All Products</button>
                        <button class="filter-btn" data-filter="dinnerware">Dinnerware</button>
                        <button class="filter-btn" data-filter="cookware">Cookware</button>
                        <button class="filter-btn" data-filter="glassware">Glassware</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="catalog-products">
            <div class="container">
                <div class="products-grid" id="catalogGrid">
                    <!-- Products will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>Kashmira Shah</h4>
                    <p>Premium Crockery Solutions</p>
                </div>
                <div class="footer-section">
                    <h4>Products</h4>
                    <p>Ektra by Srithai Superware</p>
                </div>
                <div class="footer-section">
                    <h4>Contact</h4>
                    <p>+91 98765 43210</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Kashmira Shah. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="catalog.js"></script>
</body>
</html>
